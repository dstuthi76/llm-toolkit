[project]
name = "privacyrag"
version = "0.1.0"
description = "RAG pipeline with PII redaction before storage, local-first embedding/generation, and an append-only audit log."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scikit-learn>=1.2"]

[project.optional-dependencies]
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
local-llm = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privacyrag*"]
