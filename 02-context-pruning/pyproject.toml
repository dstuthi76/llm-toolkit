[project]
name = "contextprune"
version = "0.1.0"
description = "Score, prune, and reorder RAG/prompt context chunks to fight context-rot and cut token spend."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scikit-learn>=1.2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contextprune*"]
