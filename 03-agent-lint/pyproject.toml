[project]
name = "agentlint"
version = "0.1.0"
description = "Lint multi-agent conversations for loops, topic drift, and premature termination."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlint*"]
