[project]
name = "reliably"
version = "0.1.0"
description = "Semantic validation and targeted auto-repair for LLM structured outputs -- goes beyond 'is this valid JSON' to 'is this actually correct'."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reliably*"]
